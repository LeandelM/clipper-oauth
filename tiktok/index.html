<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipper · Conectando TikTok</title>
<style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;text-align:center}a{color:#ff4d8d}</style>
</head><body>
<div><h2>Volviendo a Clipper…</h2>
<p>Si no pasa nada, <a id="go" href="#">pulsa aquí</a>. Clipper tiene que estar abierto en este PC.</p></div>
<script>
// Página puente: TikTok exige una dirección https fija. Esta página no guarda nada,
// solo reenvía el código de autorización a Clipper, que corre en el PC del usuario.
var dest = "http://localhost:8765/oauth/tiktok/callback" + location.search;
document.getElementById("go").href = dest;
location.replace(dest);
</script>
</body></html>
